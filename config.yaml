# ---------------------------------------------------------------------------
# Application Configuration — Indigenous Cattle Breed Classifier
# ---------------------------------------------------------------------------
# Override any value via environment variables (see app.py for the mapping).
# ---------------------------------------------------------------------------

title: "Indigenous Cattle Breed Classifier"
description: "Identify cattle breeds from images using deep learning (PyTorch ResNet-18). Upload a photo or provide a URL."
version: "1.0.0"

author:
  name: "Ajit Kumar Singh"
  website: "https://sajit9285.github.io/myportfolio"

about: |
  This is a Cattle Breed Classifier using Deep Learning built on top of PyTorch.
  The project was built by Ajit Kumar Singh.

  The model recognizes 26 popular Indian cattle breeds with a ResNet-18
  architecture trained on ~4,000 images.

  - Blog: https://sajit9285.github.io/myportfolio
  - Original web app: https://cattle-breed-classifier.herokuapp.com
  - Source code: https://github.com/sajit9285/cattle-breed-classifier-webapp

code: "https://github.com/sajit9285/cattle-breed-classifier-webapp"

# Inference behaviour
inference:
  top_n: 3                    # Number of predictions to return
  confidence_threshold: 0.0   # Minimum probability to include a prediction (0.0 = all)
  max_file_size_mb: 10        # Maximum uploaded file size
  max_image_dimension: 2048   # Maximum image width/height in pixels

# Google Drive model location (can be overridden by env vars)
model:
  file_url: "https://drive.google.com/u/0/uc?id=1x5Ljh9xtNfXFMm97AMlewW1nZ77XS-gb&export=download"
  classes_url: "https://drive.google.com/u/0/uc?id=1IaF_zn-RDnsEntYp86F5G7FNlEkQ8KJ_&export=download"
  file_name: "cattle_breed_classifier_full_model.pth"
  classes_name: "classes.txt"

# Sample images for the UI demo
sampleImages:
  - name: "Gir Cow"
    url: "https://cpimg.tistatic.com/05562730/b/4/Brown-Gir-Cow.jpg"
  - name: "Mehsana Buffalo"
    url: "https://img3.exportersindia.com/product_images/bc-full/dir_170/5099898/black-mehsana-buffalo-1501733678-3189068.jpeg"
  - name: "Dangi Cow"
    url: "https://1.bp.blogspot.com/-n2TgPiF8bng/WDfY8Sv2G0I/AAAAAAAAC8U/DQ6B4noSTEEK-eO8lChFEfuUO5lvIJyAgCLcB/s600/Dangi%2BCattle.jpg"
  - name: "Sahiwal Cow"
    url: "https://img1.exportersindia.com/product_images/bc-full/dir_192/5735123/sahiwal-cow-1529766224-4013945.jpeg"

# API info
api:
  base_url: "/api"
  endpoints:
    - path: "POST /api/classify"
      description: "Upload an image file for classification"
    - path: "GET /api/classify?url=<image_url>"
      description: "Classify an image from a URL"
    - path: "GET /api/classes"
      description: "List all recognized breeds"
    - path: "GET /ping"
      description: "Health check (returns pong)"
    - path: "GET /health"
      description: "Extended health check with version info"
    - path: "POST /api/classify/batch"
      description: "Classify multiple images in one request (JSON body)"
    - path: "GET /config"
      description: "Return app configuration"

# Deployment info
deployment:
  default_port: 5001
  workers_recommended: 4
  gunicorn_command: "gunicorn --bind 0.0.0.0:$PORT --workers 4 app:app"
  uvicorn_command: "uvicorn app:app --host 0.0.0.0 --port $PORT --workers 4"
