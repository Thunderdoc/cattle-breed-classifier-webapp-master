# ---------------------------------------------------------------------------
# Application Configuration — Indigenous Cattle Breed Classifier (v2)
# ---------------------------------------------------------------------------
# Environment variables always win over the values below (see webapp/config.py).
# ---------------------------------------------------------------------------

title: "Bovine AI — Indigenous Cattle Breed Classifier"
description: >-
  Identify 26 indigenous Indian cattle and buffalo breeds from a single photo.
  Fine-tuned ResNet-18 inference in milliseconds, a researched breed
  encyclopedia, and a production-grade REST API.
version: "2.0.0"

author:
  name: "Ajit Kumar Singh"
  website: "https://sajit9285.github.io/myportfolio"

about: |
  Bovine AI is a cattle breed classifier built on PyTorch + Flask + React.

  The model recognises 26 indigenous Indian cattle and buffalo breeds with a
  ResNet-18 architecture fine-tuned on ~4,000 images. When the trained
  checkpoint is absent the service degrades gracefully to a clearly-labelled
  deterministic demo engine so every integration path stays testable.

  - Source code: https://github.com/sajit9285/cattle-breed-classifier-webapp
  - Original web app: https://cattle-breed-classifier.herokuapp.com

code: "https://github.com/sajit9285/cattle-breed-classifier-webapp"

# Inference behaviour (env overrides: TOP_N_PREDICTIONS, CONFIDENCE_THRESHOLD,
# MAX_FILE_SIZE_MB, MAX_IMAGE_DIMENSION, BATCH_MAX_IMAGES)
inference:
  top_n: 5
  confidence_threshold: 0.0
  max_file_size_mb: 10
  max_image_dimension: 4096
  batch_max_images: 16

# Model artifacts (env overrides: EXPORT_FILE_URL, EXPORT_CLASSES_URL, ...)
model:
  file_url: "https://drive.google.com/u/0/uc?id=1x5Ljh9xtNfXFMm97AMlewW1nZ77XS-gb&export=download"
  classes_url: "https://drive.google.com/u/0/uc?id=1IaF_zn-RDnsEntYp86F5G7FNlEkQ8KJ_&export=download"
  file_name: "cattle_breed_classifier_full_model.pth"
  classes_name: "classes.txt"

# Bundled real reference photos served from /static/dataset (same-origin, CSP-safe)
sampleImages:
  - name: "Gir Cow"
    url: "/static/dataset/gir-cow.jpg"
  - name: "Murrah Buffalo"
    url: "/static/dataset/murrah-buffalo.jpg"
  - name: "Sahiwal Cow"
    url: "/static/dataset/sahiwal-cow.jpg"
  - name: "Dangi Cow"
    url: "/static/dataset/dangi-cow.jpg"
  - name: "White Bull"
    url: "/static/dataset/white-bull.jpg"

# API surface
api:
  base_url: "/api/v1"
  endpoints:
    - path: "POST /api/v1/predict"
      description: "Classify one image (multipart file, JSON {image|url}, or ?url=)"
    - path: "POST /api/v1/predict/batch"
      description: "Classify up to 16 images per request"
    - path: "GET /api/v1/breeds"
      description: "Encyclopedia index with species/utility/q filters"
    - path: "GET /api/v1/breeds/{slug}"
      description: "Single breed profile"
    - path: "GET /api/v1/classes"
      description: "Model class names"
    - path: "GET /api/v1/samples"
      description: "Bundled sample images"
    - path: "GET /api/v1/stats"
      description: "Public counters"
    - path: "GET /api/v1/system"
      description: "Engine, version and limit metadata"
    - path: "GET /health"
      description: "Liveness + model status"
    - path: "GET /ready"
      description: "Readiness probe"
    - path: "GET /metrics"
      description: "Prometheus text exposition"
    - path: "POST /api/classify"
      description: "Legacy v1 alias"

deployment:
  default_port: 5001
  gunicorn_command: "gunicorn -c gunicorn_conf.py app:app"
  docker_command: "docker compose up --build"
