services:
  web:
    build:
      context: .
      args:
        WITH_TORCH: "0" # set to "1" to bake the PyTorch runtime into the image
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      RATE_LIMIT_REQUESTS: "120"
      # EXPORT_FILE_URL / EXPORT_CLASSES_URL / MODEL_PATH can point at your own
      # object storage instead of the original Google Drive links.
    volumes:
      - model-cache:/srv/models
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  model-cache:
